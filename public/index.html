<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="福麻大乱斗" />
  <title>福麻大乱斗学习模拟器 v11</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 大厅 -->
  <section id="lobby" class="view active">
    <div class="card">
      <button id="rulesBtn" class="rules-entry" aria-label="查看规则">
        <svg class="re-ico" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M21 5c-1.1-.35-2.3-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/>
        </svg>
        <span>规则</span>
      </button>
      <h1 class="logo"><span>福麻大乱斗</span><em>学习模拟器 <b class="ver" id="appVer">v12</b></em></h1>
      <p class="sub">四人联机 · 金百搭 · 花即分</p>
      <input id="nameInput" placeholder="你的昵称" maxlength="8" />
      <button id="createBtn" class="primary">创建房间</button>
      <div class="divider"><span>或</span></div>
      <input id="roomInput" placeholder="输入房间码" maxlength="4" />
      <button id="joinBtn">加入房间</button>
      <p id="lobbyMsg" class="msg"></p>
    </div>
  </section>

  <!-- 游戏 -->
  <section id="game" class="view">
    <header class="topbar">
      <span id="roomCode">房间 --</span>
      <span id="jokerInfo">金 --</span>
      <span id="wallInfo">牌墙 --</span>
      <span id="roundInfo">第0局</span>
    </header>

    <div class="table">
      <div class="opp opp-top" data-seat="2"><div class="opp-box"><div class="pinfo"></div><div class="melds"></div></div><div class="opp-disc"></div></div>
      <div class="opp opp-left" data-seat="1"><div class="opp-box"><div class="pinfo"></div><div class="melds"></div></div><div class="opp-disc"></div></div>
      <div class="opp opp-right" data-seat="3"><div class="opp-box"><div class="pinfo"></div><div class="melds"></div></div><div class="opp-disc"></div></div>
      <div class="center">
        <div id="lastDiscard" class="last-discard"></div>
        <div id="turnHint" class="turn-hint"></div>
        <div id="flagInfo" class="flag-info"></div>
      </div>
    </div>

    <div class="self">
      <div class="self-info" id="selfInfo"></div>
      <div class="self-melds-box"><div class="self-melds" id="selfMelds"></div></div>
      <div class="jinkan-tip" id="jinkanTip" hidden>金坎已宣告 · 手牌全部盖倒 · 只摸牌不换牌 · 摸到金即胡</div>
      <div class="hand" id="hand"></div>
      <div class="self-disc" id="selfDisc"></div>
    </div>

    <div class="actions" id="actions"></div>
    <div class="log" id="log"></div>

    <!-- v11：快捷表情（按钮挂在操作栏右侧，面板向上弹出） -->
    <div class="social" id="social">
      <button id="emojiBtn" class="social-btn" aria-label="快捷表情" title="快捷表情">😀</button>
      <button id="muteBtn" class="social-btn mute" aria-label="音效开关" title="音效开关">🔊</button>
      <button id="voiceBtn" class="social-btn mute voice" aria-label="报牌语音" title="报牌语音">语</button>
    </div>
    <div id="emojiBackdrop" class="emoji-backdrop"></div>
    <div id="emojiPanel" class="emoji-panel" role="dialog" aria-label="快捷表情">
      <div class="ep-head">快捷表情<span>点一下全桌都能看到</span></div>
      <div id="emojiGrid" class="ep-grid"></div>
    </div>
    <div id="emojiLayer" class="emoji-layer"></div>
    <div id="fxLayer" class="fx-layer"></div>

    <!-- 等待面板: 开始 -->
    <div id="waitingPanel" class="overlay">
      <div class="modal">
        <h2>房间 <span id="waitRoom">--</span></h2>
        <div id="playerList" class="player-list"></div>
        <div id="botControls" class="bot-controls">
          <button id="addBotBtn">+ 添加机器人</button>
          <button id="removeBotBtn">− 移除机器人</button>
        </div>
        <button id="startBtn" class="primary">开始游戏</button>
        <button id="backLobbyBtn" class="back-btn">返回首页</button>
        <p id="waitHint" class="msg"></p>
      </div>
    </div>

    <!-- 换牌面板 -->
    <div id="swapPanel" class="overlay">
      <div class="modal">
        <h2>换牌阶段</h2>
        <div id="swapDice" class="swap-dice" aria-live="polite"></div>
        <div id="swapDiceText" class="swap-dice-text"></div>
        <p id="swapDesc" class="msg"></p>
        <div id="swapSuits" class="suit-row"></div>
        <div id="swapSelect" class="swap-select"></div>
        <div id="swapChoices" class="swap-choices"></div>
        <p id="swapWait" class="msg"></p>
      </div>
    </div>

    <!-- 结算面板 -->
    <div id="resultModal" class="overlay">
      <div class="modal">
        <h2 id="resultTitle"></h2>
        <div id="resultBody"></div>
        <button id="againBtn" class="primary">再来一局</button>
        <p id="resultHint" class="msg"></p>
      </div>
    </div>
  </section>

  <!-- 规则说明（首页点「规则」打开） -->
  <div id="rulesModal" class="overlay rules-overlay">
    <div class="modal rules-modal">
      <div class="rules-head">
        <h2>福麻大乱斗 · 规则</h2>
        <button id="rulesClose" class="rules-close" aria-label="关闭规则">✕</button>
      </div>
      <p class="rules-tip">点标题可以展开 / 收起 · 先看第 1 节就能上手</p>
      <div id="rulesBody" class="rules-body"></div>
    </div>
  </div>

  <!-- 竖屏提示（仅竖屏显示，横屏自动隐藏） -->
  <div id="rotateHint"><div><div class="rh-ico">↻</div>请横屏游玩<br><small>福麻大乱斗学习模拟器 · 手机横放体验更佳</small><br><button id="rotateGo">继续用竖屏</button></div></div>

  <script src="game.js"></script>
  <script>
    // 注册 PWA Service Worker: 支持「添加到主屏幕」与离线缓存
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    // 竖屏提示：允许手动关闭，避免被误当成页面打不开
    document.getElementById('rotateGo').addEventListener('click', () => {
      document.getElementById('rotateHint').classList.add('dismiss');
      window.dispatchEvent(new Event('resize'));
    });
  </script>
</body>
</html>
