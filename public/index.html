<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="福麻大乱斗" />
  <title>福麻大乱斗学习模拟器 v1</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 大厅 -->
  <section id="lobby" class="view active">
    <div class="card">
      <h1 class="logo"><span>福麻大乱斗</span><em>学习模拟器 <b class="ver" id="appVer">v1</b></em></h1>
      <p class="sub">四人联机 · 金百搭 · 花即分</p>
      <input id="nameInput" placeholder="你的昵称" maxlength="8" />
      <button id="createBtn" class="primary">创建房间</button>
      <div class="divider"><span>或</span></div>
      <input id="roomInput" placeholder="输入房间码" maxlength="4" />
      <button id="joinBtn">加入房间</button>
      <p id="lobbyMsg" class="msg"></p>
    </div>
  </section>

  <!-- 游戏 -->
  <section id="game" class="view">
    <header class="topbar">
      <span id="roomCode">房间 --</span>
      <span id="jokerInfo">金 --</span>
      <span id="wallInfo">牌墙 --</span>
      <span id="roundInfo">第0局</span>
    </header>

    <div class="table">
      <div class="opp opp-top" data-seat="2"><div class="opp-box"><div class="pinfo"></div><div class="melds"></div></div><div class="opp-disc"></div></div>
      <div class="opp opp-left" data-seat="1"><div class="opp-box"><div class="pinfo"></div><div class="melds"></div></div><div class="opp-disc"></div></div>
      <div class="opp opp-right" data-seat="3"><div class="opp-box"><div class="pinfo"></div><div class="melds"></div></div><div class="opp-disc"></div></div>
      <div class="center">
        <div id="lastDiscard" class="last-discard"></div>
        <div id="turnHint" class="turn-hint"></div>
        <div id="flagInfo" class="flag-info"></div>
      </div>
    </div>

    <div class="self">
      <div class="self-info" id="selfInfo"></div>
      <div class="self-melds-box"><div class="self-melds" id="selfMelds"></div></div>
      <div class="jinkan-tip" id="jinkanTip" hidden>金坎已宣告 · 手牌全部盖倒 · 只摸牌不换牌 · 摸到金即胡</div>
      <div class="hand" id="hand"></div>
      <div class="self-disc" id="selfDisc"></div>
    </div>

    <div class="actions" id="actions"></div>
    <div class="log" id="log"></div>

    <!-- 等待面板: 开始 -->
    <div id="waitingPanel" class="overlay">
      <div class="modal">
        <h2>房间 <span id="waitRoom">--</span></h2>
        <div id="playerList" class="player-list"></div>
        <div id="botControls" class="bot-controls">
          <button id="addBotBtn">+ 添加机器人</button>
          <button id="removeBotBtn">− 移除机器人</button>
        </div>
        <button id="startBtn" class="primary">开始游戏</button>
        <p id="waitHint" class="msg"></p>
      </div>
    </div>

    <!-- 换牌面板 -->
    <div id="swapPanel" class="overlay">
      <div class="modal">
        <h2>换牌阶段</h2>
        <div id="swapDice" class="swap-dice" aria-live="polite"></div>
        <div id="swapDiceText" class="swap-dice-text"></div>
        <p id="swapDesc" class="msg"></p>
        <div id="swapSuits" class="suit-row"></div>
        <div id="swapSelect" class="swap-select"></div>
        <div id="swapChoices" class="swap-choices"></div>
        <p id="swapWait" class="msg"></p>
      </div>
    </div>

    <!-- 结算面板 -->
    <div id="resultModal" class="overlay">
      <div class="modal">
        <h2 id="resultTitle"></h2>
        <div id="resultBody"></div>
        <button id="againBtn" class="primary">再来一局</button>
        <p id="resultHint" class="msg"></p>
      </div>
    </div>
  </section>

  <!-- 竖屏提示（仅竖屏显示，横屏自动隐藏） -->
  <div id="rotateHint"><div><div class="rh-ico">↻</div>请横屏游玩<br><small>福麻大乱斗学习模拟器 · 手机横放体验更佳</small><br><button id="rotateGo">继续用竖屏</button></div></div>

  <script src="game.js"></script>
  <script>
    // 注册 PWA Service Worker: 支持「添加到主屏幕」与离线缓存
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    // 竖屏提示：允许手动关闭，避免被误当成页面打不开
    document.getElementById('rotateGo').addEventListener('click', () => {
      document.getElementById('rotateHint').classList.add('dismiss');
      window.dispatchEvent(new Event('resize'));
    });
  </script>
</body>
</html>
