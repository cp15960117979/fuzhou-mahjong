<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="福麻大乱斗" />
  <title>福麻大乱斗学习模拟器 v12 · 单机版</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0b6b3a; color: #fff; overflow: hidden; }
.view { display: none; height: 100%; }
.view.active { display: flex; flex-direction: column; }

/* ---------- 大厅 ---------- */
#lobby { align-items: center; justify-content: center; }
.card { background: rgba(0,0,0,.25); padding: 28px 22px; border-radius: 16px; width: 86%; max-width: 360px; }
.card h1 { font-size: 30px; text-align: center; letter-spacing: 4px; }
.card h1.logo { line-height: 1.15; margin-bottom: 14px; }
.card h1.logo span { display: block; }
.card h1.logo em {
  display: block; font-style: normal; font-size: 15px; letter-spacing: 6px;
  margin-top: 8px; color: #ffcf3f; font-weight: 600; text-indent: 6px;
}
/* 版本号：每更新一次 +1，和标题一起显示 */
.card h1.logo em .ver {
  display: inline-block; font-size: 11px; letter-spacing: 0; font-weight: 700;
  margin-left: 6px; padding: 1px 7px; vertical-align: 2px;
  border: 1px solid rgba(255,207,63,.7); border-radius: 999px;
  background: rgba(255,207,63,.16); color: #ffe680;
}
.sub { text-align: center; opacity: .8; margin: 6px 0 20px; font-size: 13px; }
.card input { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 10px; font-size: 16px; background: rgba(255,255,255,.95); }
.card button { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 16px; background: rgba(255,255,255,.2); color: #fff; margin-bottom: 6px; }
.card button.primary { background: #ffcf3f; color: #333; font-weight: 700; }
.divider { text-align: center; margin: 10px 0; opacity: .6; font-size: 13px; position: relative; }
.divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 38%; height: 1px; background: rgba(255,255,255,.4); }
.divider::before { left: 0; } .divider::after { right: 0; }
.msg { text-align: center; color: #ffd; min-height: 18px; font-size: 13px; margin-top: 8px; }

/* ---------- 顶栏 ---------- */
.topbar { display: flex; justify-content: space-between; padding: 8px 12px; font-size: 13px; background: rgba(0,0,0,.3); }

/* 顶栏开金提示：文字 + 一张真牌，直观看出金是哪张 */
#jokerInfo { display: inline-flex; align-items: center; gap: 5px; }
#jokerInfo .jk-label { font-weight: 700; color: #ffe082; }
#jokerInfo .jk-name { opacity: .95; }
#jokerInfo .jk-tile { width: 19px; height: 26px; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.5); flex: 0 0 auto; }
#jokerInfo .jk-tile.joker { border-width: 1px; }
#jokerInfo .jk-tile.joker::after { display: none; } /* 牌太小，"金"角标会糊成一团，黄底已够醒目 */

/* ---------- 牌桌（横屏布局：三家环绕 + 中央弃牌区） ---------- */
.table { flex: 1; position: relative; margin: 6px; }
.opp { position: absolute; max-width: 230px; }
.opp-box { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 4px 7px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.opp-top { top: 4px; left: 50%; transform: translateX(-50%); }
.opp-left { left: 4px; top: 50%; transform: translateY(-50%); }
.opp-right { right: 4px; top: 50%; transform: translateY(-50%); }
.pinfo { font-size: 12px; margin-bottom: 3px; white-space: nowrap; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pinfo .cur { color: #ffcf3f; font-weight: 700; }
.pinfo .off { opacity: .4; }
.pinfo .dealer, .self-info .dealer { background: #ffcf3f; color: #333; border-radius: 5px; padding: 0 4px; font-weight: 700; font-size: 11px; }
.pinfo .flower, .self-info .flower { background: rgba(255,105,180,.9); color: #fff; border-radius: 5px; padding: 0 4px; font-weight: 700; font-size: 11px; }
/* 报听：金色高亮 + 光晕呼吸，状态栏里一眼能看到 */
.ting-flag {
  background: linear-gradient(180deg, #ffe98a, #ffc400);
  color: #4a3000; border-radius: 5px; padding: 0 6px;
  font-weight: 800; font-size: 11px; letter-spacing: 1px;
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
  box-shadow: 0 0 0 1px rgba(255,214,64,.95), 0 0 8px rgba(255,193,7,.8);
  animation: tingPulse 1.6s ease-in-out infinite;
}
@keyframes tingPulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(255,214,64,.95), 0 0 5px rgba(255,193,7,.55); }
  50%      { box-shadow: 0 0 0 1px rgba(255,235,140,1), 0 0 12px rgba(255,193,7,.95); }
}
@media (prefers-reduced-motion: reduce) { .ting-flag { animation: none; } }
/* 金坎：红底，和报听的金色区分开 */
.jinkan-flag { background: #d84315; color: #fff; border-radius: 5px; padding: 0 4px; font-weight: 700; font-size: 11px; }
.self-info { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 3px; flex-wrap: wrap; }
.self-info .cur { color: #ffcf3f; font-weight: 700; }
.melds { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
.opp-disc { margin-top: 3px; padding-top: 3px; border-top: 1px dashed rgba(255,255,255,.28); }
.opp-disc .disc-label { font-size: 10px; opacity: .65; margin-bottom: 2px; }
.opp-disc .disc-tiles { display: flex; flex-wrap: wrap; gap: 2px; }
.center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; background: rgba(0,0,0,.18); border-radius: 12px; padding: 10px 14px; min-width: 120px; }
.last-discard { min-height: 50px; display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; max-width: 250px; }
.turn-hint { margin-top: 6px; font-size: 12px; color: #ffcf3f; min-height: 16px;
  text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 0 8px rgba(0,0,0,.35); }   /* 没有底框，靠文字阴影保证在绿桌面上看得清 */

/* ---------- 牌（真实麻将牌面：筒=圆点 条=竹节 万=数字 花=单字） ---------- */
.tile { position: relative; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(180deg,#ffffff,#f1f1e6); border: 1px solid #d8d8cc; border-radius: 5px; width: 30px; height: 40px; box-shadow: 0 1px 2px rgba(0,0,0,.45); overflow: hidden; }
.tile svg { width: 100%; height: 100%; display: block; }
.tile.small { width: 22px; height: 30px; border-radius: 3px; }
.tile.back { background: repeating-linear-gradient(45deg,#1565c0,#1565c0 4px,#0d47a1 4px,#0d47a1 8px); border-color: #0d47a1; }
.tile.joker { background: linear-gradient(180deg,#ffe484,#ffcf3f); border: 2px solid #f08a00; }
.tile.joker::after { content: '金'; position: absolute; right: 1px; top: 0; font-size: 8px; line-height: 1; color: #b00; font-weight: 700; }
.tile.small.joker::after { font-size: 7px; }
.tile.sel { outline: 3px solid #ffcf3f; }
/* 刚摸上来的那张：和手牌拉开距离 + 绿框上浮，一眼认出；打出别的牌后自动归位 */
.tile.just-drawn { margin-left: 12px; transform: translateY(-5px); box-shadow: 0 0 0 2px #4cd07d, 0 3px 7px rgba(0,0,0,.5); }

/* ---------- 自己手牌 ---------- */
.self { padding: 4px 6px; }
.self-melds-box { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 4px 7px; margin-bottom: 4px; }
.self-melds { display: flex; gap: 6px; flex-wrap: wrap; min-height: 4px; }
.hand { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-bottom: 4px; }
.hand .tile { flex: 0 0 auto; }   /* 不许被 flex 压窄：牌多就换行，不拉成细条 */
.self-disc { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding-top: 3px; border-top: 1px dashed rgba(255,255,255,.28); }
.self-disc .disc-label { font-size: 10px; opacity: .65; margin-right: 4px; }

/* ---------- 操作 ---------- */
.actions { display: flex; gap: 8px; justify-content: center; padding: 8px 54px; min-height: 48px; flex-wrap: wrap; }
.actions button { padding: 10px 18px; border: none; border-radius: 22px; font-size: 15px; font-weight: 700; }
.act-hu { background: #e53935; color: #fff; }
.act-peng { background: #fb8c00; color: #fff; }
.act-gang { background: #8e24aa; color: #fff; }
.act-pass { background: rgba(255,255,255,.25); color: #fff; }
.act-angang { background: #8e24aa; color: #fff; }
.act-bugang { background: #7b1fa2; color: #fff; border: 1px solid #e1a6ff; }
.act-jinkan { background: #d84315; color: #fff; }
.act-ting { background: #00897b; color: #fff; }
.turn-hint { min-height: 16px; }
.flag-info { font-size: 12px; color: #ff7043; min-height: 16px; font-weight: 700; }
.swap-choices { margin-top: 4px; max-height: 120px; overflow-y: auto; }
.swap-choices .prow.done span:last-child { color: #ffcf3f; }
.swap-choices .prow { border-bottom: 1px dashed rgba(255,255,255,.12); }
.swap-choices .prow:last-child { border-bottom: 0; }

.log { font-size: 11px; opacity: .7; padding: 2px 146px 8px 10px; min-height: 46px; max-height: 56px; overflow-y: auto; }

/* ---------- 竖屏提示 ---------- */
#rotateHint { display: none; }
#rotateHint.dismiss { display: none !important; }
/* 只有进了牌桌才要求横屏：大厅竖屏能正常用，否则首页的「规则」按钮会被整屏提示挡住 */
@media (orientation: portrait) and (max-width: 900px) {
  body.in-game #rotateHint { display: flex; position: fixed; inset: 0; z-index: 999; background: #0b6b3a; color: #fff; align-items: center; justify-content: center; text-align: center; font-size: 18px; line-height: 1.8; }
  #rotateHint small { font-size: 13px; opacity: .8; }
  #rotateGo { margin-top: 18px; padding: 10px 22px; font-size: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); color: #fff; }
  .rh-ico { font-size: 46px; margin-bottom: 8px; animation: spin 2.4s ease-in-out infinite; }
  @keyframes spin { 0%,40% { transform: rotate(0); } 60%,100% { transform: rotate(90deg); } }
}

/* ---------- 手机竖屏/窄屏回退（横屏默认用上方基础布局） ---------- */
@media (max-width: 560px) {
  /* 顶栏更紧凑 */
  .topbar { padding: 6px 8px; font-size: 12px; gap: 4px; flex-wrap: wrap; }
  .topbar #modeInfo { padding: 1px 6px; }

  /* 对手三家牌更小更紧凑 */
  .opp { min-width: 64px; max-width: 150px; }
  .opp-box { padding: 3px 5px; border-radius: 8px; }
  .opp-top { top: 2px; }
  .opp-left { left: 2px; top: 40%; }
  .opp-right { right: 2px; top: 40%; }
  .pinfo { font-size: 11px; }
  .tile.small { width: 18px; height: 24px; border-radius: 3px; }
  .tile.back { background: repeating-linear-gradient(45deg,#1565c0,#1565c0 3px,#0d47a1 3px,#0d47a1 6px); }

  /* 自己手牌：竖屏牌多时折成两排，不横向滚动也不压扁 */
  .self { padding: 6px 4px; }
  .hand { gap: 5px; flex-wrap: wrap; overflow: visible; justify-content: center; padding-bottom: 3px; }
  .self-melds-box { padding: 3px 5px; margin-bottom: 6px; }

  /* 操作按钮加大 (拇指友好) */
  .actions { padding: 10px 8px; gap: 10px; min-height: 64px; }
  .actions button { padding: 14px 22px; font-size: 17px; border-radius: 26px; min-height: 50px; }
  .act-hu { box-shadow: 0 2px 0 #a01818; }
  .act-peng { box-shadow: 0 2px 0 #b35e00; }
  .act-gang { box-shadow: 0 2px 0 #5e1670; }

  /* 弹窗在手机上几乎全屏 */
  .overlay { padding: 12px; }
  .modal { width: 100%; padding: 20px 16px; border-radius: 18px; }
  .modal h2 { font-size: 19px; }
  .suit-btn { width: 72px; height: 72px; font-size: 26px; }
  .swap-dice { gap: 14px; min-height: 48px; margin: 6px 0 4px; }
  .die { width: 50px; height: 50px; padding: 6px; border-radius: 10px; }
  .die i { width: 9px; height: 9px; }
  .swap-dice-text { font-size: 13px; }
  .swap-dice-text b { font-size: 15px; }
  .result-main b { font-size: 32px; }

  /* 日志在手机上压扁，右侧让给横排的三个圆按钮 */
  .log { max-height: 54px; min-height: 50px; font-size: 10px; padding-right: 168px; }
}

/* 极窄屏(<360)继续微调 */
@media (max-width: 360px) {
  .tile { width: 23px; height: 32px; font-size: 11px; }
  .actions button { padding: 12px 16px; font-size: 16px; }
}

/* ---------- 竖屏专用：给对家的出牌行让位（横屏一律不动） ----------
   对家的「牌盒 + 出牌」会随副露和弃牌越堆越高，左右两家按 40% 定位就会被压住。
   --opp-shift 由 placeOpponents() 量出对家块底边后写入，这里只负责吃这个值。 */
@media (orientation: portrait) and (max-width: 900px) {
  .opp { max-width: 122px; }
  .opp-left, .opp-right { top: calc(40% + var(--opp-shift, 0px)); }
  /* 竖屏中间只留文字和刚打出的那张牌，不要深色底框（横屏维持原样） */
  .center { width: 118px; min-width: 0; padding: 0; background: none; border-radius: 0; }
  .last-discard { max-width: 118px; }
  .turn-hint { font-size: 11px; line-height: 1.35; }
}

/* 竖屏且屏幕很矮（老安卓 640 高、SE 一代）：纵向根本放不下「对家块 + 左右两家」，
   这两类机器上把对手牌缩小一档、对家放宽到一行 8 张，才腾得出位置 */
@media (orientation: portrait) and (max-height: 700px) {
  .tile.small { width: 16px; height: 22px; border-radius: 3px; }
  .opp { max-width: 112px; }
  .opp-top { max-width: 152px; }
  .pinfo { font-size: 10px; gap: 3px; }
  .opp-disc .disc-label, .disc-label { font-size: 9px; }
}

/* ---------- 顶栏模式 ---------- */
.topbar #modeInfo { background: rgba(255,207,63,.25); padding: 1px 8px; border-radius: 10px; color: #ffcf3f; }

/* ---------- 覆盖层 / 弹窗 ---------- */
.overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,.6); align-items: center; justify-content: center; z-index: 20; }
.overlay.show { display: flex; }
.modal { background: #11593a; border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 22px 20px; width: 88%; max-width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,.5); max-height: 90%; overflow-y: auto; }
.modal h2 { text-align: center; font-size: 20px; margin-bottom: 14px; }

/* 等待面板 */
.player-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.pl-item { background: rgba(0,0,0,.25); padding: 8px 10px; border-radius: 8px; font-size: 14px; }
.bot-controls { display: none; gap: 8px; justify-content: center; margin-bottom: 14px; }
.bot-controls button { flex: 1; padding: 9px 0; border: 1px solid rgba(255,255,255,.4); border-radius: 10px; background: transparent; color: #fff; font-size: 14px; }
.bot-controls button:disabled { opacity: .4; }
.mode-select { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 14px; }
.ms-label { font-size: 14px; opacity: .8; }
.mode-btn { flex: 1; padding: 9px 0; border: 1px solid rgba(255,255,255,.4); border-radius: 10px; background: transparent; color: #fff; font-size: 14px; }
.mode-btn.active { background: #ffcf3f; color: #333; font-weight: 700; border-color: #ffcf3f; }

/* 换牌摇骰 */
.swap-dice { display: flex; gap: 16px; justify-content: center; align-items: center; margin: 10px 0 6px; min-height: 58px; }
.die {
  width: 62px; height: 62px; border-radius: 13px; background: #fffdf4;
  border: 1px solid #d8cfb4; padding: 8px;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  box-shadow: 0 5px 12px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.95);
}
.die i { display: block; width: 12px; height: 12px; border-radius: 50%; justify-self: center; align-self: center; }
.die i.on { background: #22262a; box-shadow: inset 0 -1px 1px rgba(255,255,255,.35); }
.die.rolling { animation: dieShake .16s infinite alternate; }
@keyframes dieShake {
  from { transform: rotate(-9deg) translateY(1px) scale(1.02); }
  to   { transform: rotate(9deg) translateY(-5px) scale(.98); }
}
.swap-dice-text { text-align: center; font-size: 14px; color: #eafff2; margin: 0 0 8px; min-height: 20px; line-height: 1.6; }
.swap-dice-text b { color: #ffcf3f; font-size: 17px; }
.swap-dice-text.rolling { opacity: .75; }
.swap-give { margin-top: 3px; font-size: 14px; color: #bdf6d4; }
.swap-give b { color: #ffcf3f; }
@media (prefers-reduced-motion: reduce) { .die.rolling { animation: none; } }

/* 换牌面板 */
.suit-row { display: flex; gap: 12px; justify-content: center; margin: 14px 0; }.suit-btn { width: 64px; height: 64px; border-radius: 14px; border: none; font-size: 22px; font-weight: 700; background: #ffcf3f; color: #333; }
.suit-btn:active { transform: scale(.95); }
.suit-btn.confirm { width: auto; height: auto; padding: 12px 18px; border-radius: 10px; font-size: 16px; background: #2ecc71; color: #fff; }
.swap-select { margin: 8px 0; }
.swap-tiles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-height: 220px; overflow-y: auto; padding: 6px; }
.swap-tiles .tile { cursor: pointer; transform: scale(1.15); }
.swap-tiles .tile.selected { outline: 3px solid #ff3b3b; outline-offset: 1px; box-shadow: 0 0 10px rgba(255,59,59,.6); }
.swap-sel-info { text-align: center; font-size: 13px; color: #ffe; margin: 6px 0; min-height: 16px; }

/* 弹窗内的主按钮（开始游戏 / 再来一局） */
#startBtn, #againBtn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; background: #ffcf3f; color: #333; margin-top: 8px; }
#startBtn:disabled { opacity: .5; }
#startBtn:active, #againBtn:active { transform: scale(.98); }

/* 结算面板 */
.jiang-end {
  display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px;
  padding: 10px 12px; border-radius: 10px;
  background: linear-gradient(135deg, rgba(255,207,63,.22), rgba(255,207,63,.08));
  border: 1px solid rgba(255,207,63,.55);
  box-shadow: 0 0 12px rgba(255,207,63,.18);
}
.jiang-end b { font-size: 15px; color: #ffcf3f; letter-spacing: .5px; }
.jiang-end span { font-size: 12px; line-height: 1.55; opacity: .88; }
.result-main { text-align: center; font-size: 16px; margin-bottom: 10px; }
.result-main b { font-size: 28px; color: #ffcf3f; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
.tag { background: rgba(255,255,255,.15); padding: 3px 8px; border-radius: 8px; font-size: 12px; }
.payers { border-top: 1px solid rgba(255,255,255,.2); padding-top: 8px; }
.prow { display: flex; justify-content: space-between; padding: 5px 4px; font-size: 14px; }
.prow.head { opacity: .7; font-size: 12px; }
.prow .pay { color: #ff9f9f; }
.prow .recv { color: #ffcf3f; font-weight: 700; }
.prow.total { border-top: 1px dashed rgba(255,255,255,.3); margin-top: 4px; font-weight: 700; }

/* 结算亮牌：四行（胡家在最上），吃碰杠在最左、手牌居中、胡的那张在最右 */
#resultModal .modal { width: 96%; max-width: 820px; }
.settle { border-top: 1px solid rgba(255,255,255,.2); margin-top: 4px; }
.srow {
  display: grid; grid-template-columns: 66px minmax(0,1fr) 54px 62px;
  align-items: center; gap: 4px; padding: 4px 2px;
  border-bottom: 1px dashed rgba(255,255,255,.12);
}
.srow:last-child { border-bottom: none; }
.srow.shead { opacity: .6; font-size: 11px; border-bottom-style: solid; }
.srow.win { background: rgba(255,207,63,.12); border-radius: 8px; }
.sname { display: flex; align-items: center; gap: 3px; font-size: 12px; white-space: nowrap; overflow: hidden; }
.sname b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.scards { display: flex; align-items: center; gap: 2px; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.scards > * { flex: 0 0 auto; }

/* ---------- 右下角悬浮按钮（横排，贴在屏幕底部，给手牌让出整片空间） ---------- */
.social { position: fixed; right: 8px; bottom: 6px; display: flex; flex-direction: row; gap: 6px; z-index: 27; }  /* 高于表情遮罩(24)与面板(26)，打开面板时仍点得到 */
.social-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
  background: rgba(0,0,0,.42); color: #fff; font-size: 20px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.35); backdrop-filter: blur(4px);
  transition: transform .12s ease, background .2s ease;
}
.social-btn:active { transform: scale(.9); }
.social-btn.mute { font-size: 17px; opacity: .9; }
.social-btn.voice { font-size: 13px; font-weight: 700; letter-spacing: 0; font-family: inherit; }
.social-btn.off { opacity: .55; }
.social-btn.bad { color: #ff7b7b; border-color: rgba(255,123,123,.55); }   /* 语音包没加载出来 */
.social-btn.shake { animation: socialShake .3s ease; }
@keyframes socialShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }

/* ---------- 表情面板 ---------- */
.emoji-panel {
  display: none; position: fixed; right: 8px; width: min(278px, 84vw); z-index: 26;
  background: linear-gradient(180deg, #14684a, #0e5238);
  border: 1px solid rgba(255,255,255,.22); border-radius: 14px; padding: 10px;
  box-shadow: 0 10px 32px rgba(0,0,0,.55);
}
/* 遮罩：点空白处只关面板，不会顺手把牌打出去 */
.emoji-backdrop { display: none; position: fixed; inset: 0; z-index: 24; background: rgba(0,0,0,.22); }
.emoji-backdrop.show { display: block; }
.emoji-panel.show { display: block; animation: epIn .16s ease-out; }
@keyframes epIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.ep-head { font-size: 12px; font-weight: 700; color: #ffcf3f; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.ep-head span { font-weight: 400; font-size: 10px; opacity: .7; color: #dff7e9; }
.ep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.ep-item {
  display: flex; align-items: center; gap: 7px; padding: 8px 8px; border-radius: 10px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); color: #fff;
  font-size: 12px; text-align: left; position: relative; overflow: hidden;
}
.ep-item:active { transform: scale(.96); background: rgba(255,255,255,.2); }
.ep-item .ep-ico { font-size: 20px; flex: 0 0 auto; }
.ep-item .ep-lab { line-height: 1.2; }
.ep-item[data-id="kneel"] { grid-column: span 2; }
.ep-item[data-id="kneel"] .ep-lab { font-size: 11px; opacity: .92; }

/* ---------- 表情气泡 ---------- */
.emoji-layer { position: fixed; inset: 0; pointer-events: none; z-index: 25; overflow: hidden; }
.emoji-bubble {
  position: absolute; max-width: 240px; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 14px; background: #fffdf3; color: #2a2110;
  font-size: 14px; font-weight: 700; line-height: 1.35; white-space: pre-line;
  box-shadow: 0 6px 20px rgba(0,0,0,.45), 0 0 0 2px rgba(255,207,63,.75);
  transform-origin: var(--org, 50% 100%);
  animation: bubbleIn .22s ease-out both;
}
.emoji-bubble .eb-inner { display: flex; align-items: center; gap: 8px; animation: bubbleScale .3s cubic-bezier(.18,1.5,.4,1) both; }
.emoji-bubble::after {
  content: ''; position: absolute; width: 10px; height: 10px; background: #fffdf3;
  transform: rotate(45deg); bottom: -5px; left: var(--tail, 50%);
  box-shadow: 2px 2px 0 rgba(255,207,63,.75);
}
.emoji-bubble .eb-ico { font-size: 26px; line-height: 1; animation: icoPop .45s ease-out both; }
.emoji-bubble .eb-txt { word-break: break-word; }
.emoji-bubble.tone-red { background: #fff0f0; box-shadow: 0 6px 20px rgba(0,0,0,.45), 0 0 0 2px #ff5252; }
.emoji-bubble.tone-red::after { background: #fff0f0; box-shadow: 2px 2px 0 #ff5252; }
.emoji-bubble.tone-warn { background: #fffbe8; }
.emoji-bubble.tone-swag { background: #fff6e0; box-shadow: 0 6px 20px rgba(0,0,0,.45), 0 0 0 2px #ff9800; }
.emoji-bubble.tone-plead { background: #fff1f5; box-shadow: 0 6px 20px rgba(0,0,0,.45), 0 0 0 2px #ff6f91; }
.emoji-bubble.tone-plead::after { background: #fff1f5; box-shadow: 2px 2px 0 #ff6f91; }
.emoji-bubble.tone-plead .eb-txt { color: #b3244a; }
.emoji-bubble.tone-swag .eb-txt { font-size: 17px; letter-spacing: 1px; }
.emoji-bubble.out { animation: bubbleOut .3s ease forwards; }
@keyframes bubbleScale { from { transform: scale(.5); } to { transform: scale(1); } }
.emoji-bubble.pos-right { transform: translate(-100%, -50%); transform-origin: 100% 50%; }
.emoji-bubble.pos-left { transform: translate(0, -50%); transform-origin: 0 50%; }
.emoji-bubble.pos-top { transform: translate(-50%, 0); transform-origin: 50% 0; }
.emoji-bubble.pos-self { transform: translate(-50%, -100%); }
.emoji-bubble.pos-right::after, .emoji-bubble.pos-left::after { top: 50%; bottom: auto; margin-top: -5px; }
.emoji-bubble.pos-right::after { right: -5px; left: auto; }
.emoji-bubble.pos-left::after { left: -5px; }
.emoji-bubble.pos-top::after { top: -5px; bottom: auto; }
@keyframes bubbleIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bubbleOut { to { opacity: 0; scale: .85; } }
@keyframes icoPop { 0% { transform: scale(.2) rotate(-18deg); } 100% { transform: none; } }

/* ---------- 大牌特效 ---------- */
.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; display: none; }
.fx-layer.show { display: block; pointer-events: auto; cursor: pointer; }
.fx-flash {
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 46%, rgba(255,255,255,.95), rgba(255,214,64,.6) 26%, rgba(255,140,0,.18) 52%, transparent 70%);
  animation: fxFlash .9s ease-out forwards;
}
@keyframes fxFlash { 0% { opacity: 0; transform: scale(.55); } 16% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
.fx-rays {
  position: absolute; left: 50%; top: 46%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax;
  background: repeating-conic-gradient(from 0deg, rgba(255,214,64,.5) 0deg 2.5deg, transparent 2.5deg 10deg);
  -webkit-mask-image: radial-gradient(circle, #000 6%, rgba(0,0,0,.65) 26%, transparent 58%);
  mask-image: radial-gradient(circle, #000 6%, rgba(0,0,0,.65) 26%, transparent 58%);
  animation: fxRays 1.9s cubic-bezier(.2,.75,.25,1) forwards;
}
@keyframes fxRays { 0% { opacity: 0; transform: scale(.15) rotate(0); } 22% { opacity: .95; } 100% { opacity: 0; transform: scale(1) rotate(64deg); } }
.fx-title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 0 12px; }
.fx-big {
  font-size: clamp(40px, 10vw, 104px); font-weight: 900; letter-spacing: .1em; color: #ffd54a;
  text-shadow: 0 0 18px rgba(255,190,0,.95), 0 0 44px rgba(255,120,0,.75), 0 5px 0 #8a3b00, 0 10px 24px rgba(0,0,0,.6);
  animation: fxPop .8s cubic-bezier(.16,1.45,.36,1) both;
}
.fx-big.lv1 { font-size: clamp(34px, 7vw, 72px); color: #ffe9a8; text-shadow: 0 0 14px rgba(255,190,0,.8), 0 4px 0 #7a3300, 0 8px 18px rgba(0,0,0,.55); }
.fx-sub {
  font-size: clamp(13px, 2.4vw, 19px); color: #fff; font-weight: 700; letter-spacing: 2px;
  padding: 3px 14px; border-radius: 999px; background: rgba(0,0,0,.3);
  text-shadow: 0 2px 6px rgba(0,0,0,.9); animation: fxFade .5s .2s ease both;
}
.fx-fan {
  margin-top: 4px; font-size: clamp(14px, 2.6vw, 20px); font-weight: 800; color: #fff8dc;
  padding: 4px 16px; border-radius: 999px; background: rgba(12,6,0,.62);
  border: 1px solid rgba(255,213,74,.55); box-shadow: 0 4px 14px rgba(0,0,0,.35);
  animation: fxFade .5s .35s ease both;
}
.fx-fan b { font-size: 1.6em; color: #ffd54a; text-shadow: 0 0 14px rgba(255,180,0,.95), 0 2px 0 #7a3300; vertical-align: -2px; }
@keyframes fxPop { 0% { opacity: 0; transform: scale(.35) rotate(-6deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1) rotate(0); } }
@keyframes fxFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.fx-coin {
  position: absolute; top: -8vh; font-size: 20px; color: #ffcf3f; font-weight: 900;
  text-shadow: 0 0 10px rgba(255,190,0,.9); animation: coinFall linear forwards;
}
@keyframes coinFall {
  0% { opacity: 0; transform: translateY(0) rotate(0) scale(.7); }
  10% { opacity: 1; }
  100% { opacity: 0; transform: translateY(112vh) rotate(540deg) scale(1.1); }
}
.fx-layer.shake .fx-title { animation: fxShake .5s ease-out; }
@keyframes fxShake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-7px,4px)} 40%{transform:translate(6px,-5px)} 60%{transform:translate(-4px,3px)} 80%{transform:translate(3px,-2px)} }
@media (prefers-reduced-motion: reduce) {
  .fx-flash, .fx-rays, .fx-coin, .fx-big { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
}
/* 横屏手机屏幕矮：面板收紧，少挡牌桌 */
@media (max-height: 520px) {
  .fx-big { font-size: clamp(28px, 6.4vw, 52px); }
  .fx-title { transform: translateY(-13%); gap: 4px; }
  .emoji-panel { width: min(252px, 62vw); padding: 8px; }
  .ep-head { margin-bottom: 6px; font-size: 11px; }
  .ep-head span { display: none; }
  .ep-grid { gap: 5px; }
  .ep-item { padding: 6px 7px; font-size: 11px; }

}
@media (max-width: 560px) {

  .emoji-panel { width: min(300px, 92vw); }
  .emoji-bubble { max-width: 190px; font-size: 13px; padding: 7px 10px; }
  .emoji-bubble .eb-ico { font-size: 22px; }
}

   v11：首页规则入口 / 规则弹窗 / 房间返回首页
   ============================================================ */

/* 大厅卡片右上角的规则标志 */
.card { position: relative; }
.card .rules-entry {

.rule-sec {
  border: 1px solid rgba(255,255,255,.14); border-radius: 10px; margin-bottom: 8px;
  background: rgba(0,0,0,.18); overflow: hidden;
}

}

.rule-n {
  flex: 0 0 auto; width: 21px; height: 21px; border-radius: 6px;

.rule-sec.open .rule-arrow { transform: rotate(180deg); }
.rule-c { display: none; padding: 2px 12px 12px; font-size: 13px; line-height: 1.72; color: #eafff2; }
.rule-sec.open .rule-c { display: block; animation: ruleFade .18s ease-out; }
@keyframes ruleFade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

.rule-c p { margin: 6px 0; }
.rule-c ul { margin: 6px 0; padding-left: 18px; }
.rule-c li { margin: 5px 0; }
.rule-c b, .rule-c strong { color: #ffd75e; font-weight: 700; }
.rule-c em { font-style: normal; color: #9fe8c2; }
.rule-c .hl {
  display: block; margin: 8px 0; padding: 8px 10px; border-radius: 8px;
  background: rgba(255,207,63,.12); border-left: 3px solid #ffcf3f;
  font-size: 12.5px; line-height: 1.6;
}
.rule-c .mini { opacity: .7; font-size: 12px; }

/* 规则里的表格：窄屏可横向滑动，不挤成一团 */
.rule-scroll { overflow-x: auto; margin: 8px -2px; }
.rule-scroll::-webkit-scrollbar { height: 4px; }
.rule-c table { border-collapse: collapse; width: 100%; font-size: 12px; min-width: 300px; }
.rule-c th, .rule-c td { border: 1px solid rgba(255,255,255,.16); padding: 5px 8px; text-align: left; }
.rule-c th { background: rgba(0,0,0,.28); color: #ffe9a8; font-weight: 700; white-space: nowrap; }
.rule-c td:first-child { white-space: nowrap; }
.rule-c tr:nth-child(even) td { background: rgba(255,255,255,.03); }

/* 房间面板的返回首页 */
.back-btn {
  width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,.28); background: transparent;
  color: #d9f5e6; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
/* 箭头用 CSS 画，避免小字号下「←」被渲染成一根短横 */
.back-btn::before {
  content: ''; width: 7px; height: 7px; flex: 0 0 auto;
  border-left: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor;
  transform: rotate(45deg) translate(1px, -1px);

@media (max-height: 520px) {

  .rules-head { padding: 9px 14px 7px; }

  .rule-h { padding: 9px 11px; font-size: 13px; }
  .rule-c { font-size: 12.5px; line-height: 1.65; }
}

  <section id="game" class="view">
    <header class="topbar">
      <span id="roomCode">房间 --</span>

      <span id="wallInfo">牌墙 --</span>
      <span id="roundInfo">第0局</span>

        <div id="turnHint" class="turn-hint"></div>

    <div id="emojiPanel" class="emoji-panel" role="dialog" aria-label="快捷表情">

 *   27-62  花牌     （共36张，只计分 + 补花，不参与牌型）

// ---------- 牌名 ----------
const WAN = ['一万', '二万', '三万', '四万', '五万', '六万', '七万', '八万', '九万'];
const TIAO = ['一条', '二条', '三条', '四条', '五条', '六条', '七条', '八条', '九条'];
const TONG = ['一筒', '二筒', '三筒', '四筒', '五筒', '六筒', '七筒', '八筒', '九筒'];
// 36 张花：8 传统 + 28 原字牌（东南西北中发白各4）
const HUA_TRAD = ['春', '夏', '秋', '冬', '梅', '兰', '竹', '菊'];
const HUA_ZI = ['东', '南', '西', '北', '中', '發', '白'];

const TILE_NAMES = (() => {
  const n = [];
  for (let i = 0; i < 9; i++) n.push(WAN[i]);
  for (let i = 0; i < 9; i++) n.push(TIAO[i]);
  for (let i = 0; i < 9; i++) n.push(TONG[i]);
  for (let i = 0; i < 8; i++) n.push(HUA_TRAD[i]);
  for (let z = 0; z < 7; z++) for (let k = 0; k < 4; k++) n.push(HUA_ZI[z]);

const NUMERAL = 27;      // 数牌种类数 0-26
const FLOWER_BASE = 27;  // 花牌起始编码
const FLOWER_COUNT = 36; // 花牌总数

function suitOf(tile) {
  if (tile >= FLOWER_BASE) return 'f';
  if (tile < 9) return 'm';
  if (tile < 18) return 's';
  return 'p';
}
function rankOf(tile) {
  if (tile >= FLOWER_BASE) return tile - FLOWER_BASE + 1;
  return (tile % 9) + 1;
}
function isNumeral(tile) { return tile < FLOWER_BASE; }
function isFlower(tile) { return tile >= FLOWER_BASE; }

// ---------- 牌堆 / 洗牌 ----------
function buildDeck() {
  const deck = [];
  for (let t = 0; t < NUMERAL; t++) for (let k = 0; k < 4; k++) deck.push(t);
  for (let t = FLOWER_BASE; t < FLOWER_BASE + FLOWER_COUNT; t++) deck.push(t); // 花牌各1张
  return deck; // 108 + 36 = 144
}
function shuffle(arr, rng = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 分离：非花牌计 counts(27)；金计 jokers；花计 flowers
function separateJokers(tiles, jokerTile) {
  const counts = new Array(NUMERAL).fill(0);
  let jokers = 0, flowers = 0;
  for (const t of tiles) {
    if (t >= FLOWER_BASE) { flowers++; continue; }
    if (t === jokerTile) jokers++;
    else counts[t]++;
  }
  return { counts, jokers, flowers };
}

// ---------- 胡牌分解（含金） ----------
// 把剩余牌分解成 need 个面子（刻子/顺子），金作百搭，不含将。
function formMelds(counts, jokers, need) {
  let i = 0;
  while (i < NUMERAL && counts[i] === 0) i++;
  if (i === NUMERAL) {
    if (need === 0) return [];

      const melds = [];
      for (let k = 0; k < need; k++) melds.push({ type: 'ke', tiles: ['J', 'J', 'J'], joker: 3 });
      return melds;

    return null;

  if (need === 0) return null;

  // 刻子方向
  if (counts[i] >= 3) {
    counts[i] -= 3;
    const r = formMelds(counts, jokers, need - 1);
    counts[i] += 3;
    if (r) return [{ type: 'ke', tiles: [i, i, i], joker: 0 }, ...r];
  }
  if (counts[i] >= 2 && jokers >= 1) {
    counts[i] -= 2;
    const r = formMelds(counts, jokers - 1, need - 1);
    counts[i] += 2;
    if (r) return [{ type: 'ke', tiles: [i, i, 'J'], joker: 1 }, ...r];
  }
  if (counts[i] >= 1 && jokers >= 2) {
    counts[i] -= 1;
    const r = formMelds(counts, jokers - 2, need - 1);
    counts[i] += 1;
    if (r) return [{ type: 'ke', tiles: [i, 'J', 'J'], joker: 2 }, ...r];
  }
  if (jokers >= 3) {
    const r = formMelds(counts, jokers - 3, need - 1);
    if (r) return [{ type: 'ke', tiles: ['J', 'J', 'J'], joker: 3 }, ...r];
  }

  // 顺子方向（数牌）
  if (i < NUMERAL && (i % 9) <= 6) {
    const a = i, b = i + 1, c = i + 2;
    if (counts[a] >= 1 && counts[b] >= 1 && counts[c] >= 1) {
      counts[a]--; counts[b]--; counts[c]--;
      const r = formMelds(counts, jokers, need - 1);
      counts[a]++; counts[b]++; counts[c]++;
      if (r) return [{ type: 'shun', tiles: [a, b, c], joker: 0 }, ...r];
    }
    if (counts[a] >= 1 && counts[b] >= 1 && jokers >= 1) {
      counts[a]--; counts[b]--;
      const r = formMelds(counts, jokers - 1, need - 1);
      counts[a]++; counts[b]++;

      counts[a]++; counts[c]++;
      if (r) return [{ type: 'shun', tiles: [a, 'J', c], joker: 1 }, ...r];

      counts[b]--; counts[c]--;
      const r = formMelds(counts, jokers - 1, need - 1);

// 按"恰好 need 个面子 + 1 将"分解，返回 {pair, melds} 或 null
function decomposeNeed(counts, jokers, need) {
  if (!Number.isInteger(need) || need < 0 || need > 5) return null;
  const total = counts.reduce((a, b) => a + b, 0) + jokers;
  if (total !== need * 3 + 2) return null;
  for (let i = 0; i < NUMERAL; i++) {

    let j = jokers;
    let pair;
    if (c[i] >= 2) { c[i] -= 2; pair = { tile: i, joker: 0 }; }
    else if (c[i] >= 1 && j >= 1) { c[i] -= 1; j -= 1; pair = { tile: i, joker: 1 }; }
    else if (j >= 2) { j -= 2; pair = { tile: 'J', joker: 2 }; }
    else continue;
    const melds = formMelds(c, j, need);
    if (melds) return { pair, melds };
  }
  return null;
}

// 标准型：n 面子 + 1 将，返回 {pair, melds} 或 null
// 福麻是 16 张制：胡牌 17 张 = 5 面子 + 将；同时兼容 14 张（4 面子）的旧用例
function decomposeStandard(counts, jokers) {
  const total = counts.reduce((a, b) => a + b, 0) + jokers;
  const need = (total - 2) / 3;
